name: Notes schema checks

on:
  push:
    paths:
      - 'db/notes/**'
      - 'tests/test_notes_schema.py'
      - '.github/workflows/notes-schema.yml'
  pull_request:
    paths:
      - 'db/notes/**'
      - 'tests/test_notes_schema.py'
      - '.github/workflows/notes-schema.yml'

jobs:
  sqlite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
