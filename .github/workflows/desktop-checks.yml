name: Windows desktop build and test installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'db/notes/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/desktop-checks.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'db/notes/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/desktop-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Compile, test, package x64 Windows
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Tauri icon assets
        run: npm run icons
      - name: SQLite regression tests
        run: python -m unittest discover -s tests -v
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
      - name: Rust unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust compilation check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Create unsigned NSIS Windows test installer
        run: npm exec --workspace=@nou/desktop -- tauri build --bundles nsis
      - name: Validate installer file and write SHA256SUMS
        shell: pwsh
        run: |
          $folder = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $folder -Filter '*.exe' -File)
          if ($installers.Count -lt 1) { throw 'NSIS installer was not created' }
          $lines = foreach ($installer in $installers) {
            if ($installer.Length -lt 1000000) { throw "Installer suspiciously small: $($installer.Name)" }
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Path (Join-Path $folder 'SHA256SUMS.txt') -Encoding utf8
      - name: Upload unsigned test installer
        uses: actions/upload-artifact@v4
        with:
          name: project-nou-windows-x64-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
