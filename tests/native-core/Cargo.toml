[package]
name = "nou-native-core-checks"
version = "0.0.0"
edition = "2021"
publish = false
[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1"
